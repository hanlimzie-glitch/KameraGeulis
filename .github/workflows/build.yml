name: Build
on:
  push:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Linux unit tests (kg_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKG_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || true
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E 'Failed|Failure|FAILED|assertion|No tests|Segmentation|Abort' ctest.log | head -30 | sed 's/^/::error ::/'
            tail -15 ctest.log | sed 's/^/::error ::/'
            exit $code
          fi

  windows-build:
    name: Windows x64 Release (build + tests + artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: windows-deps-

      - name: Configure (Release, x64)
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DKG_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -j 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== errors (first 25) ==="
            Select-String -Path build.log -Pattern 'error [A-Za-z]+[0-9]+|fatal error C|FAILED:' |
              Select-Object -First 25 |
              ForEach-Object { Write-Host "::error ::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path ctest.log -Pattern 'Failed|Failure|FAILED:|assertion|No tests|Segmentation|Abort' |
              Select-Object -First 25 | ForEach-Object { Write-Host "::error ::$($_.Line.Trim())" }
            Get-Content ctest.log -Tail 15 | ForEach-Object { Write-Host "::error ::$($_.Trim())" }
            exit $LASTEXITCODE
          }

      - name: Package artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # App exe (wherever CMake put it)
          Get-ChildItem -Recurse -Path build -Filter KameraGeulis.exe |
            Where-Object { $_.FullName -notmatch '_deps' } |
            Select-Object -First 1 | Copy-Item -Destination dist
          # All runtime DLLs produced by the build (gpupixel.dll etc.)
          Get-ChildItem -Recurse -Path build -Filter *.dll |
            Where-Object { $_.FullName -notmatch '_deps.*(glfw|imgui)' } |
            ForEach-Object { Copy-Item $_.FullName -Destination dist -Force }
          # VC++ runtime (app-local): onnxruntime.dll + gpupixel.dll are /MD
          # binaries, so a clean Windows box needs the v143 CRT. App-local
          # deployment (vcruntime140/_1 + msvcp140) is permitted by the VS
          # redist license and needs no admin install. See docs/REDISTRIBUTABLES.md.
          try {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            Write-Host "vswhere: $vswhere (exists: $(Test-Path $vswhere))"
            $vsRoot = & $vswhere -latest -products * -property installationPath
            Write-Host "vsRoot: $vsRoot"
            $redistRoot = Join-Path $vsRoot 'VC\Redist\MSVC'
            Write-Host "redistRoot: $redistRoot (exists: $(Test-Path $redistRoot))"
            if (Test-Path $redistRoot) {
              Get-ChildItem $redistRoot | ForEach-Object { Write-Host "  msvc redist: $($_.Name)" }
            }
            $want = 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll'
            $candidates = @(Get-ChildItem -Path $redistRoot -Directory -Recurse -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue |
                            Sort-Object FullName -Descending)
            Write-Host "CRT candidates: $($candidates.Count)"
            $crt = $null
            foreach ($cand in $candidates) {
              $missing = $want | Where-Object { -not (Test-Path (Join-Path $cand.FullName $_)) }
              Write-Host "  candidate: $($cand.FullName) missing: $($missing -join ', ')"
              if (-not $missing) { $crt = $cand; break }
            }
            if (-not $crt) { throw 'no complete Microsoft.VC*.CRT folder with vcruntime140/vcruntime140_1/msvcp140' }
            foreach ($dll in $want) {
              Copy-Item (Join-Path $crt.FullName $dll) -Destination dist -Force
            }
            Write-Host "redist CRT copied from: $($crt.FullName)"
          } catch {
            Write-Host "::error ::redistributable packaging failed: $($_.Exception.Message)"
            throw
          }
          # GPUPixel runtime resources (lookup textures loaded by filters at
          # creation/render time — e.g. BeautyFaceUnitFilter loads src/res/*.png
          # via Util::GetResourcePath()+"res"). Missing files => null SourceImage
          # => virtual call on null == the gpupixel.dll 0x3968a crash. Ship them.
          $resCandidates = Get-ChildItem -Recurse -Path build -Directory -Filter res |
                             Where-Object { $_.FullName -match 'gpupixel' } |
                             Sort-Object FullName -Descending
          $res = $null
          foreach ($c in $resCandidates) {
            if ((Test-Path (Join-Path $c.FullName 'lookup_gray.png')) -and
                (Test-Path (Join-Path $c.FullName 'lookup_skin.png'))) { $res = $c; break }
          }
          if (-not $res) {
            $fallback = Join-Path 'build' '_deps\gpupixel-src\src\res'
            if (Test-Path $fallback) { $res = Get-Item $fallback }
          }
          if (-not $res) { throw 'GPUPixel src/res folder not found under build\_deps (expected gpupixel-src\src\res)' }
          New-Item -ItemType Directory -Force -Path dist\res | Out-Null
          Copy-Item (Join-Path $res.FullName '*.png') -Destination dist\res -Force
          Write-Host "res copied from: $($res.FullName) ($((Get-ChildItem dist\res).Count) files)"
          # Models ship in the artifact (M2b): CI-verified models-v1 assets.
          New-Item -ItemType Directory -Force -Path dist\models | Out-Null
          gh release download models-v1 --repo hanlimzie-glitch/KameraGeulis `
            --pattern "face_detection_short_range.onnx" --pattern "face_mesh.onnx" `
            --pattern "selfie_multiclass_256x256.onnx" `
            --dir dist\models --clobber
          if ($LASTEXITCODE -ne 0) { throw "models-v1 download failed (exit $LASTEXITCODE)" }
          Write-Host "models copied into dist\models"
          # Debug symbols (for symbolizing crash dumps; not needed at runtime)
          $lnk = Get-ChildItem -Recurse -Path build -Filter gpupixel.pdb -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lnk) { Copy-Item $lnk.FullName dist -Force; Write-Host "pdb: $($lnk.FullName)" } else { Write-Host '::warning ::gpupixel.pdb not found (crash symbolization limited)' }
          $lnk2 = Get-ChildItem -Recurse -Path build -Filter gpupixel.map -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lnk2) { Copy-Item $lnk2.FullName dist -Force; Write-Host "map: $($lnk2.FullName)" } else { Write-Host '::warning ::gpupixel.map not found' }
          Copy-Item THIRD_PARTY.md, README.md, STATUS.md -Destination dist
          Get-ChildItem dist | ForEach-Object { Write-Host "dist: $($_.Name) ($($_.Length) B)" }

      - name: Verify artifact contents (fail build if incomplete)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'dist\KameraGeulis.exe','dist\gpupixel.dll','dist\onnxruntime.dll',
            'dist\vcruntime140.dll','dist\vcruntime140_1.dll','dist\msvcp140.dll',
            'dist\THIRD_PARTY.md','dist\README.md','dist\STATUS.md',
            'dist\res\lookup_gray.png','dist\res\lookup_origin.png','dist\res\lookup_skin.png',
            'dist\res\lookup_light.png','dist\res\lookup_custom.png','dist\res\mouth.png','dist\res\blusher.png',
            'dist\models\face_detection_short_range.onnx','dist\models\face_mesh.onnx',
            'dist\models\selfie_multiclass_256x256.onnx',
            'dist\gpupixel.pdb','dist\gpupixel.map')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error ::missing from artifact: $_" }
            throw "artifact incomplete ($($missing.Count) required files missing)"
          }
          Get-ChildItem -Recurse dist | Sort-Object FullName |
            ForEach-Object { Write-Host ("{0,-64} {1,10} B" -f $_.FullName.Substring($PWD.Path.Length + 1), $_.Length) }
          Write-Host "artifact contents OK ($($required.Count) required files present)"

      - name: Smoke test (selftest from packaged artifact)
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = 'Stop'
            $log = Join-Path $env:APPDATA 'KameraGeulis\log.txt'
            if (Test-Path $log) { Remove-Item $log -Force }
            Write-Host "== running dist\KameraGeulis.exe --selftest (models ship in dist\models) =="
            $proc = Start-Process -FilePath 'dist\KameraGeulis.exe' -ArgumentList '--selftest' `
                                  -Wait -PassThru -NoNewWindow
            $code = $proc.ExitCode
            Write-Host "selftest exit code: $code"
            Write-Host "== $log (tail) =="
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 80 } else { Write-Host "(log.txt tidak ditemukan)" }
            if ($code -ne 0) { throw "selftest FAILED (exit $code) - lihat ekor log di atas" }
            Write-Host "SELFTEST PASS"
          } catch {
            Write-Host "::error ::smoke test failed: $($_.Exception.Message)"
            throw
          }

      - name: Resolve crash RVA 0x3968a against gpupixel.map
        shell: pwsh
        continue-on-error: true
        run: ./scripts/resolve-pdb-rva.ps1 -MapPath dist\gpupixel.map -DllPath dist\gpupixel.dll -Rva 0x3968a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamerageulis-m2-windows-x64
          path: dist
          retention-days: 14
