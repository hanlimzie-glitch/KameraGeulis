name: Build
on:
  push:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Linux unit tests (kg_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKG_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || true
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E 'Failed|Failure|FAILED|assertion|No tests|Segmentation|Abort' ctest.log | head -30 | sed 's/^/::error ::/'
            tail -15 ctest.log | sed 's/^/::error ::/'
            exit $code
          fi

  windows-build:
    name: Windows x64 Release (build + tests + artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: windows-deps-

      - name: Configure (Release, x64)
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DKG_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -j 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== errors (first 25) ==="
            Select-String -Path build.log -Pattern 'error [A-Za-z]+[0-9]+|fatal error C|FAILED:' |
              Select-Object -First 25 |
              ForEach-Object { Write-Host "::error ::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path ctest.log -Pattern 'Failed|Failure|FAILED:|assertion|No tests|Segmentation|Abort' |
              Select-Object -First 25 | ForEach-Object { Write-Host "::error ::$($_.Line.Trim())" }
            Get-Content ctest.log -Tail 15 | ForEach-Object { Write-Host "::error ::$($_.Trim())" }
            exit $LASTEXITCODE
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # App exe (wherever CMake put it)
          Get-ChildItem -Recurse -Path build -Filter KameraGeulis.exe |
            Where-Object { $_.FullName -notmatch '_deps' } |
            Select-Object -First 1 | Copy-Item -Destination dist
          # All runtime DLLs produced by the build (gpupixel.dll etc.)
          Get-ChildItem -Recurse -Path build -Filter *.dll |
            Where-Object { $_.FullName -notmatch '_deps.*(glfw|imgui)' } |
            ForEach-Object { Copy-Item $_.FullName -Destination dist -Force }
          # VC++ runtime (app-local): onnxruntime.dll + gpupixel.dll are /MD
          # binaries, so a clean Windows box needs the v143 CRT. App-local
          # deployment (vcruntime140/_1 + msvcp140) is permitted by the VS
          # redist license and needs no admin install. See docs/REDISTRIBUTABLES.md.
          try {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            Write-Host "vswhere: $vswhere (exists: $(Test-Path $vswhere))"
            $vsRoot = & $vswhere -latest -products * -property installationPath
            Write-Host "vsRoot: $vsRoot"
            $redistRoot = Join-Path $vsRoot 'VC\Redist\MSVC'
            Write-Host "redistRoot: $redistRoot (exists: $(Test-Path $redistRoot))"
            if (Test-Path $redistRoot) {
              Get-ChildItem $redistRoot | ForEach-Object { Write-Host "  msvc redist: $($_.Name)" }
            }
            $want = 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll'
            $candidates = @(Get-ChildItem -Path $redistRoot -Directory -Recurse -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue |
                            Sort-Object FullName -Descending)
            Write-Host "CRT candidates: $($candidates.Count)"
            $crt = $null
            foreach ($cand in $candidates) {
              $missing = $want | Where-Object { -not (Test-Path (Join-Path $cand.FullName $_)) }
              Write-Host "  candidate: $($cand.FullName) missing: $($missing -join ', ')"
              if (-not $missing) { $crt = $cand; break }
            }
            if (-not $crt) { throw 'no complete Microsoft.VC*.CRT folder with vcruntime140/vcruntime140_1/msvcp140' }
            foreach ($dll in $want) {
              Copy-Item (Join-Path $crt.FullName $dll) -Destination dist -Force
            }
            Write-Host "redist CRT copied from: $($crt.FullName)"
          } catch {
            Write-Host "::error ::redistributable packaging failed: $($_.Exception.Message)"
            throw
          }
          Copy-Item THIRD_PARTY.md, README.md, STATUS.md -Destination dist
          Get-ChildItem dist | ForEach-Object { Write-Host "dist: $($_.Name) ($($_.Length) B)" }

      - name: Smoke test (selftest from packaged artifact)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            $ErrorActionPreference = 'Stop'
            Write-Host "== dist contents (what ships to the tester's PC) =="
            Get-ChildItem dist | ForEach-Object { Write-Host ("{0,-40} {1,10} B" -f $_.Name, $_.Length) }
            # Models are NOT packaged in the artifact (first-run download design).
            # For the smoke test we fetch the CI-verified models-v1 assets into dist\models,
            # run the headless --selftest, then REMOVE them again before packaging.
            gh release download models-v1 --repo hanlimzie-glitch/KameraGeulis `
              --pattern "face_detection_short_range.onnx" --pattern "face_mesh.onnx" `
              --dir dist\models --clobber
            $log = Join-Path $env:APPDATA 'KameraGeulis\log.txt'
            if (Test-Path $log) { Remove-Item $log -Force }
            Write-Host "== running dist\KameraGeulis.exe --selftest =="
            $proc = Start-Process -FilePath 'dist\KameraGeulis.exe' -ArgumentList '--selftest' `
                                  -Wait -PassThru -NoNewWindow
            $code = $proc.ExitCode
            Write-Host "selftest exit code: $code"
            Write-Host "== $log (tail) =="
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 80 } else { Write-Host "(log.txt tidak ditemukan)" }
            Remove-Item 'dist\models' -Recurse -Force
            if ($code -ne 0) { throw "selftest FAILED (exit $code) — lihat ekor log di atas" }
            Write-Host "SELFTEST PASS"
          } catch {
            Write-Host "::error ::smoke test failed: $($_.Exception.Message)"
            Remove-Item 'dist\models' -Recurse -Force -ErrorAction SilentlyContinue
            throw
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamerageulis-m2-windows-x64
          path: dist
          retention-days: 14
